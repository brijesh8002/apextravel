<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Booking Page | Apex Elite Travel</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
  <main>



    <!-- HEADER -->
    <header id="header"></header>

    <!-- HERO -->








<div class="container py-4">
      <div class="page-title mb-3">Review & book</div>

      <div class="row">
        <!-- LEFT -->
        <div class="col-lg-7">
          <!-- STEP 1 -->
          <div class="step-box active" id="step1">
            <div class="step-header">
              <div class="step-left">
                <div class="step-number">1</div>
                Your details
              </div>
              <div class="edit-btn" onclick="editStep(1)">Edit</div>
            </div>

            <div class="btn-detail"><i class="bi bi-patch-check"></i> <a href="authentication.html">Sign In</a> For Better Experience!</div>

            <div class="step-content">
              <div class="row">
                <div class="col-md-6 mb-2">
                  <input class="primary-input" placeholder="First name" />
                </div>
                <div class="col-md-6 mb-2">
                  <input class="primary-input" placeholder="Last name" />
                </div>
              </div>

              <input class="primary-input mb-2" placeholder="Email" />
              <input class="primary-input mb-3" placeholder="Phone" />

              <button class="next-btn" onclick="nextStep(1)">Next</button>
            </div>
          </div>

          <!-- STEP 2 -->
          <div class="step-box inactive" id="step2">
            <div class="step-header">
              <div class="step-left">
                <div class="step-number">2</div>
                Additional details
              </div>
              <div class="edit-btn" onclick="editStep(2)">Edit</div>
            </div>

            <div class="step-content">
              <input class="primary-input mb-2" placeholder="Address" />
              <input class="primary-input mb-3" placeholder="City" />

              <button class="next-btn" onclick="nextStep(2)">Next</button>
            </div>
          </div>

          <!-- STEP 3 -->
          <div class="step-box inactive" id="step3">
            <div class="step-header">
              <div class="step-left">
                <div class="step-number">3</div>
                Payment details
              </div>
              <div class="edit-btn" onclick="editStep(3)">Edit</div>
            </div>

            <div class="step-content">
              <input class="primary-input mb-2" placeholder="Card number" />
              <input class="primary-input mb-3" placeholder="Expiry date" />

              <button class="next-btn" onclick="nextStep(3)">Next</button>
            </div>
          </div>

          <!-- STEP 4 -->
          <div class="step-box inactive" id="step4">
            <div class="step-header">
              <div class="step-left">
                <div class="step-number">4</div>
                Confirm & Pay
              </div>
              <div class="edit-btn" onclick="editStep(4)">Edit</div>
            </div>

            <div class="step-content">
              <button class="btn btn-dark w-100">Confirm Booking</button>
            </div>
          </div>
        </div>

        <!-- RIGHT -->
        <div class="col-lg-5">
          <div class="summary-card">
            <h6>Day Trip to Taj Mahal</h6>

            <div class="muted mb-2">👤 2 × Adult</div>
            <div class="muted mb-2">📅 Sun, May 10</div>
            <div class="muted mb-2">⏰ 05:30</div>
            <div class="muted mb-3">📍 New Delhi</div>

            <hr />

            <div class="d-flex justify-content-between">
              <strong>You Pay</strong>
              <strong>400 USD</strong>
            </div>
          </div>
        </div>
      </div>
    </div>






    <!-- Footer Start -->
    <footer class="footer" id="footer"></footer>




    <!-- Footer End -->


  </main>




  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/script.js"></script>

</body>

</html>
