<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Date Input Placeholder</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
<style>


.ae90-footer-bottom {
    background:
        linear-gradient(to right,
            #00142f,
            #00275b);

    padding: 20px 0;

    border-top:
        1px solid rgba(255, 255, 255, 0.08);
}

/* wrapper */

.ae90-footer-bottom-wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;

    flex-wrap: wrap;
}

/* left */

.ae90-footer-left {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.ae90-footer-left p {
    margin: 0;

    font-size: 14px;
    font-weight: 500;

    color: rgba(255, 255, 255, 0.85);

    letter-spacing: .2px;
}

.ae90-footer-left span {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.55);
}

.ae90-footer-left span a {
    color: #fff;
    text-decoration: none;
    font-weight: 600;

    transition: .3s ease;
}

.ae90-footer-left span a:hover {
    color: var(--main-color);
}

/* right */

.ae90-footer-right {
    display: flex;
    align-items: center;
    gap: 22px;

    flex-wrap: wrap;
}

.ae90-footer-right a {
    position: relative;

    text-decoration: none;

    font-size: 14px;
    font-weight: 500;

    color: rgba(255, 255, 255, 0.78);

    transition: .3s ease;
}

/* hover line */

.ae90-footer-right a::after {
    content: "";

    position: absolute;

    left: 0;
    bottom: -6px;

    width: 0%;
    height: 1.5px;

    background: var(--main-color);

    transition: .3s ease;
}

.ae90-footer-right a:hover {
    color: #fff;
}

.ae90-footer-right a:hover::after {
    width: 100%;
}

/* =========================
        MOBILE
========================= */

@media(max-width:767px) {

    .ae90-footer-bottom {
        padding: 18px 0;
    }

    .ae90-footer-bottom-wrap {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
    }

    .ae90-footer-left p {
        font-size: 13px;
        line-height: 1.7;
    }

    .ae90-footer-left span {
        font-size: 12px;
    }

    .ae90-footer-right {
        gap: 14px;
    }

    .ae90-footer-right a {
        font-size: 13px;
    }

}
</style>

</head>

<body>

<!-- =========================
        FOOTER BOTTOM
========================= -->

<div class="ae90-footer-bottom">

    <div class="container">

        <div class="ae90-footer-bottom-wrap">

            <!-- left -->
            <div class="ae90-footer-left">

                <p>
                    © 2021 - 2026 Apex Elite Travel.
                    All Rights Reserved.
                </p>

                <span>
                    Developed By
                    <a href="https://tssgtech.com/">
                        TSSG Tech

                </span>

            </div>

            <!-- right -->
            <div class="ae90-footer-right">

                <a href="index.html">
                    Home
                </a>

                <a href="faq.html">
                    FAQ
                </a>

                <a href="terms-condition.html">
                    Terms & Conditions
                </a>

                <a href="privacy-policy.html">
                    Privacy Policy
                </a>

            </div>

        </div>

    </div>

</div>

</body>

</html>
