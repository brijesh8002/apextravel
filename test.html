<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Premium Calendar</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #f4f7ff, #eef2ff);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding: 40px 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ae4-wrapper {
            width: 100%;
            max-width: 520px;
        }

        /* Main Card */
        .ae4-main-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 32px;
            padding: 28px;
            backdrop-filter: blur(14px);
            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.06),
                0 2px 10px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .ae4-title {
            font-size: 28px;
            font-weight: 800;
            color: #111827;
            margin-bottom: 22px;
        }

        /* Date Box */
        .ae4-date-box {
            background: #fff;
            border-radius: 26px;
            padding: 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            border: 1px solid #edf0f7;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        }

        .ae4-date-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .ae4-radio {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 5px solid #b44ddb;
            background: #fff;
            flex-shrink: 0;
        }

        .ae4-day {
            font-size: 24px;
            font-weight: 800;
            color: #111827;
            line-height: 1.2;
        }

        .ae4-date {
            color: #6b7280;
            font-size: 15px;
            margin-top: 2px;
        }

        .ae4-change-btn {
            border: 0;
            background: linear-gradient(135deg, #002b6b, #0046ad);
            color: #fff;
            padding: 12px 18px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s;
            white-space: nowrap;
        }

        .ae4-change-btn:hover {
            transform: translateY(-2px);
        }

        /* Calendar */
        .ae4-calendar {
            display: none;
            margin-top: 22px;
            background: #fff;
            border-radius: 28px;
            padding: 24px;
            border: 1px solid #edf0f7;
            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.06);
        }

        .ae4-calendar.active {
            display: block;
            animation: ae4Fade 0.3s ease;
        }

        @keyframes ae4Fade {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header */
        .ae4-calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
        }

        .ae4-month {
            font-size: 20px;
            font-weight: 800;
            color: #111827;
        }

        .ae4-nav-btn {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            border: 0;
            background: #f3f6fc;
            color: #111;
            transition: 0.3s;
        }

        .ae4-nav-btn:hover {
            background: #002b6b;
            color: #fff;
        }

        /* Weekdays */
        .ae4-weekdays,
        .ae4-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }

        .ae4-weekdays {
            margin-bottom: 14px;
        }

        .ae4-weekdays span {
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            color: #9ca3af;
            text-transform: uppercase;
        }

        /* Days */
        .ae4-days button {
            height: 48px;
            border: 0;
            border-radius: 16px;
            background: #f7f8fc;
            font-size: 14px;
            font-weight: 600;
            color: #111827;
            transition: 0.25s;
            position: relative;
        }

        .ae4-days button:hover {
            background: #e8efff;
            transform: translateY(-2px);
        }

        .ae4-days button.active {
            background: linear-gradient(135deg, #002b6b, #0046ad);
            color: #fff;
            box-shadow: 0 8px 20px rgba(0, 70, 173, 0.25);
        }

        .ae4-days button.today {
            border: 2px solid #002b6b;
        }

        .ae4-empty {
            visibility: hidden;
        }

        /* Mobile */
        @media (max-width: 576px) {

            body {
                padding: 18px 12px;
            }

            .ae4-main-card {
                padding: 18px;
                border-radius: 24px;
            }

            .ae4-title {
                font-size: 24px;
            }

            .ae4-date-box {
                padding: 18px;
                border-radius: 20px;
                flex-direction: column;
                align-items: flex-start;
            }

            .ae4-day {
                font-size: 20px;
            }

            .ae4-change-btn {
                width: 100%;
            }

            .ae4-calendar {
                padding: 18px;
                border-radius: 22px;
            }

            .ae4-days button {
                height: 42px;
                border-radius: 12px;
                font-size: 13px;
            }

        }
    </style>

</head>

<body>

    <div class="ae4-wrapper">

        <div class="ae4-main-card">

            <h2 class="ae4-title">
                Select Date
            </h2>

            <!-- Date Box -->
            <div class="ae4-date-box">

                <div class="ae4-date-left">

                    <div class="ae4-radio"></div>

                    <div>

                        <div class="ae4-day"
                            id="ae4Day">
                            Wednesday
                        </div>

                        <div class="ae4-date"
                            id="ae4FullDate">
                            6 May 2026
                        </div>

                    </div>

                </div>

                <button class="ae4-change-btn"
                    onclick="ae4OpenCalendar()">

                    <i class="bi bi-calendar-event me-2"></i>
                    Change Date

                </button>

            </div>

            <!-- Calendar -->
            <div class="ae4-calendar"
                id="ae4Calendar">

                <!-- Header -->
                <div class="ae4-calendar-header">

                    <button class="ae4-nav-btn"
                        onclick="ae4PrevMonth()">

                        <i class="bi bi-chevron-left"></i>

                    </button>

                    <div class="ae4-month"
                        id="ae4MonthYear">

                    </div>

                    <button class="ae4-nav-btn"
                        onclick="ae4NextMonth()">

                        <i class="bi bi-chevron-right"></i>

                    </button>

                </div>

                <!-- Weekdays -->
                <div class="ae4-weekdays">

                    <span>Sun</span>
                    <span>Mon</span>
                    <span>Tue</span>
                    <span>Wed</span>
                    <span>Thu</span>
                    <span>Fri</span>
                    <span>Sat</span>

                </div>

                <!-- Days -->
                <div class="ae4-days"
                    id="ae4CalendarDays">

                </div>

            </div>

        </div>

    </div>

    <script>

        const ae4Calendar =
            document.getElementById("ae4Calendar");

        const ae4CalendarDays =
            document.getElementById("ae4CalendarDays");

        const ae4MonthYear =
            document.getElementById("ae4MonthYear");

        const ae4Day =
            document.getElementById("ae4Day");

        const ae4FullDate =
            document.getElementById("ae4FullDate");

        let ae4CurrentDate =
            new Date();

        let ae4SelectedDate =
            new Date();

        // Open Calendar
        function ae4OpenCalendar() {

            ae4Calendar.classList.toggle("active");

        }

        // Render Calendar
        function ae4RenderCalendar() {

            ae4CalendarDays.innerHTML = "";

            const year =
                ae4CurrentDate.getFullYear();

            const month =
                ae4CurrentDate.getMonth();

            const firstDay =
                new Date(year, month, 1).getDay();

            const lastDate =
                new Date(year, month + 1, 0).getDate();

            const today =
                new Date();

            const monthNames = [
                "January", "February", "March", "April",
                "May", "June", "July", "August",
                "September", "October", "November", "December"
            ];

            ae4MonthYear.innerHTML =
                monthNames[month] + " " + year;

            // Empty Days
            for (let i = 0; i < firstDay; i++) {

                let empty =
                    document.createElement("div");

                empty.className =
                    "ae4-empty";

                ae4CalendarDays.appendChild(empty);

            }

            // Dates
            for (let day = 1; day <= lastDate; day++) {

                let btn =
                    document.createElement("button");

                btn.innerHTML = day;

                const fullDate =
                    new Date(year, month, day);

                // Selected
                if (
                    day === ae4SelectedDate.getDate() &&
                    month === ae4SelectedDate.getMonth() &&
                    year === ae4SelectedDate.getFullYear()
                ) {

                    btn.classList.add("active");

                }

                // Today
                if (
                    day === today.getDate() &&
                    month === today.getMonth() &&
                    year === today.getFullYear()
                ) {

                    btn.classList.add("today");

                }

                // Click Date
                btn.onclick = function () {

                    ae4SelectedDate =
                        fullDate;

                    ae4Day.innerHTML =
                        fullDate.toLocaleDateString(
                            "en-US",
                            { weekday: "long" }
                        );

                    ae4FullDate.innerHTML =
                        fullDate.toLocaleDateString(
                            "en-GB",
                            {
                                day: "numeric",
                                month: "long",
                                year: "numeric"
                            }
                        );

                    ae4Calendar.classList.remove("active");

                    ae4RenderCalendar();

                };

                ae4CalendarDays.appendChild(btn);

            }

        }

        // Previous Month
        function ae4PrevMonth() {

            ae4CurrentDate.setMonth(
                ae4CurrentDate.getMonth() - 1
            );

            ae4RenderCalendar();

        }

        // Next Month
        function ae4NextMonth() {

            ae4CurrentDate.setMonth(
                ae4CurrentDate.getMonth() + 1
            );

            ae4RenderCalendar();

        }

        // Initial Load
        ae4RenderCalendar();

    </script>

</body>

</html>
